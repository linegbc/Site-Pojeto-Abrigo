<!DOCTYPE html>
<html lang="pt-br">

<head> <!-- Parte invisível -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Gov.br</title>
    <link rel="stylesheet" href="css/senha.css"/>
    <link rel="icon" type="image/png" sizes="48x48" href="./Imagem/icon.gov.png">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <img src="https://sso.acesso.gov.br/assets/govbr/img/govbr.png" alt="Logo Gov.br">
    </header>

    <!-- Conteúdo -->
    <div class="container">

        <!-- Imagem -->
        <div class="imagem">
            <img src="https://sso.acesso.gov.br/assets/govbr/img/senha.png" alt="Imagem Gov.br">
        </div>

        <!-- Login -->
        <div class="card">

            <h2>Digite sua senha</h2>

            <label>CPF</label>

            <h4>XXX.XXX.XXX-XX</h4>

            <form>

                <label for="senha">Senha</label>

                <input type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    aria-invalid="false">

                <button href="index.html" type="submit">Cancelar</button>

                <button type="submit">Entrar</button>

                <div class="esqueci">
                    <a href="#">Esqueci minha senha</a>
                </div>

            </form>

        </div>

    </div>

    <!-- Rodapé -->
    <footer>
        &copy; 2026 Página ilustrativa - Sistema Gov.br
    </footer>

</body>

</html>
